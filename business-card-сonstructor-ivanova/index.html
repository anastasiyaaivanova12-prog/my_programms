        <script>
            //������ ��� ��������� ������
            const alightList = ['left', 'center', 'right'];
            const textSizesName = ['24px', '26px', '28px'];
            const textSizesPost = ['14px', '16px', '18px'];
            const bright�olors = ['black', '#3F88E8', '#E83F56', '#097A14', '#DCA40A', '#DC0AD5'];
            const greyShades = ['#474747', 'black', '#636363', '#9E9E9E', '#BBBBBB', '#E3E3E3'];

            var addNum = document.getElementsByClassName('div-add-num')[0];
            var newNum = document.getElementsByClassName('div-new-num')[0];

            //���������� ��� ������ ������
            const addNumber = () => {
                addNum.style.display = 'none';
                newNum.style.display = 'block';
            };

            //�������� ��� ������
            const remNumber = () => {
                addNum.style.display = 'block';
                newNum.style.display = 'none';
            };

            const createCard = () => {
                //��������� �������
                document.getElementsByClassName('business-card')[0].style.display = 'flex';
                const textList = [];

                //��������� �������� �� ����� � ���������� � ������
                const organization = document.getElementsByName('info')[0].value;
                textList.push(organization);
                const fullName = document.getElementsByName('info')[1].value;
                textList.push(fullName);
                const post = document.getElementsByName('info')[2].value;
                textList.push(post);
                const number = document.getElementsByName('phone')[0].value;
                textList.push(number);
                //���������� ��� �� ���������� ��������������� ������ � ��������� ��������
                if (newNum.style.display == 'block') {
                    const number2 = document.getElementsByName('phone')[1].value;
                    textList.push(number2);
                    if (document.getElementsByClassName('new-num')[0]) {

                    } else {
                        document.getElementsByClassName('div')[3].insertAdjacentHTML('afterend', '<div class="number div new-num"></div>');
                    };
                } else {
                    if (document.getElementsByClassName('new-num')[0]) {
                        document.getElementsByClassName('new-num')[0].remove();
                    };
                };
                const email = document.getElementsByName('email')[0].value;
                textList.push(email);
                const address = document.getElementsByName('address')[0].value;
                textList.push(address);

                //���������� �������
                for (i = 0; i <= (textList.length - 1); i++){
                    document.getElementsByClassName('div')[i].textContent = textList[i];
                };

                //�����������
                if (document.getElementById('see-email').checked) {
                    document.getElementsByClassName('email div')[0].style.visibility = 'visible';
                } else {
                    document.getElementsByClassName('email div')[0].style.visibility = 'hidden';
                };
                if (document.getElementById('see-address').checked) {
                    document.getElementsByClassName('address div')[0].style.visibility = 'visible';
                } else {
                    document.getElementsByClassName('address div')[0].style.visibility = 'hidden';

                document.getElementsByClassName('div')[1].style.textAlign = alightList[document.querySelector('input[name="text-alight1"]:checked').value];
                document.getElementsByClassName('div')[1].style.fontSize = textSizesName[document.querySelector('input[name="text-size1"]:checked').value];
